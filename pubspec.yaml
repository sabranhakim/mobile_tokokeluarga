name: mobile_tokokeluarga
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0              # Untuk request API ke Laravel
  sqflite: ^2.3.0          # Database lokal untuk mode offline
  path_provider: ^2.1.2    # Mengatur lokasi penyimpanan foto
  image_picker: ^1.0.7     # Mengambil foto bon via Kamera
  camera: ^0.11.0+1        # Untuk UI kamera kustom dengan grid
  connectivity_plus: ^5.0.2 # Mendeteksi status internet
  intl: ^0.19.0            # Formatter tanggal & mata uang
  provider: ^6.1.1         # State management (status sync, loading)
  fl_chart: ^0.70.2        # Untuk grafik/chart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
